<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Calculadora de Aviso Prévio</title>

  <style>
    body{font-family:Arial,sans-serif;background:#f4f6f8;padding:20px}
    .container{max-width:420px;margin:auto;background:#fff;padding:25px;border-radius:10px;box-shadow:0 0 10px rgba(0,0,0,.1)}
    h2{text-align:center;margin-bottom:20px}
    label{display:block;margin-top:15px;font-weight:bold}
    input,select,button{width:100%;padding:10px;margin-top:5px;font-size:16px}
    button{margin-top:20px;background:#007bff;color:#fff;border:none;border-radius:5px;cursor:pointer}
    button:hover{background:#0056b3}
    .resultado{margin-top:20px;padding:15px;background:#eef2f7;border-radius:5px;min-height:24px}
  </style>
</head>

<body>
  <div class="container">
    <h2>Calculadora de Aviso Prévio</h2>

    <label>Data do desligamento</label>
    <input type="date" id="dataDesligamento" />

    <label>Tipo de aviso</label>
    <select id="tipoAviso">
      <option value="">Selecione</option>
      <option value="trabalhado">Aviso Trabalhado</option>
      <option value="indenizado">Aviso Indenizado</option>
    </select>

    <label>Data-base</label>
    <input type="date" id="dataBase" />

    <button type="button" id="btnCalcular">Calcular</button>

    <div class="resultado" id="resultado"></div>
  </div>

  <script>
    // Parse seguro para Safari/iPhone: "YYYY-MM-DD" -> Date local (sem UTC)
    function parseDateLocal(yyyyMmDd) {
      const [y, m, d] = yyyyMmDd.split("-").map(Number);
      return new Date(y, m - 1, d); // local time
    }

    function formatBR(dateObj) {
      return dateObj.toLocaleDateString("pt-BR");
    }

    function addDays(dateObj, days) {
      const d = new Date(dateObj.getFullYear(), dateObj.getMonth(), dateObj.getDate());
      d.setDate(d.getDate() + days);
      return d;
    }

    function calcularAviso() {
      const deslig = document.getElementById("dataDesligamento").value;
      const tipo = document.getElementById("tipoAviso").value;
      const base = document.getElementById("dataBase").value;
      const resultado = document.getElementById("resultado");

      if (!deslig || !tipo || !base) {
        resultado.innerHTML = "⚠️ Preencha todos os campos.";
        return;
      }

      const dataDesligamento = parseDateLocal(deslig);
      const dataBase = parseDateLocal(base);

      let dataFinal = dataDesligamento;
      if (tipo === "trabalhado") {
        dataFinal = addDays(dataDesligamento, 30);
      }

      const inicioPeriodo = addDays(dataBase, -30);

      let msg = `
        📅 <strong>Data final do aviso:</strong><br>
        ${formatBR(dataFinal)}<br><br>
      `;

      if (dataFinal >= inicioPeriodo && dataFinal <= dataBase) {
        msg += "🚨 <strong>O aviso cai no período da data-base (30 dias antes).</strong>";
      } else {
        msg += "✅ <strong>O aviso NÃO cai no período da data-base.</strong>";
      }

      resultado.innerHTML = msg;
    }

    document.getElementById("btnCalcular").addEventListener("click", calcularAviso);
  </script>
</body>
</html>
